name: link-guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: APK 直链自动改写到 seagull-apks
        run: |
          set -e
          OLD1='https://github.com/canfunan/seagull-desktop/releases/latest/download/'
          OLD2='https://github.com/caogenfunan123/seagull-desktop/releases/latest/download/'
          OLD3='https://github.com/caogenfunan123/seagull-apks/releases/latest/download/'
          NEW='https://github.com/canfunan/seagull-apks/releases/latest/download/'
          files=$(grep -rlE "seagull-desktop/releases|caogenfunan123" --include='*.html' --include='*.md' . || true)
          if [ -z "$files" ]; then echo "链接干净，无需修改"; exit 0; fi
          echo "发现旧链: $files"
          sed -i "s|$OLD1|$NEW|g; s|$OLD2|$NEW|g; s|$OLD3|$NEW|g" $files
          git config user.name "link-guard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "link-guard: APK 直链自动改写到 seagull-apks [skip ci]"
          git push
          echo "已改写并推送"
